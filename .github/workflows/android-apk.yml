name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Configure Firebase Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error title=Missing Secret::The GOOGLE_SERVICES_JSON repository secret is missing or empty. Please add it under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p frontend/android/app
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json

          node -e "
            const fs = require('fs');
            const filePath = 'frontend/android/app/google-services.json';
            let content = fs.readFileSync(filePath, 'utf8').trim();
            let data;
            try {
              data = JSON.parse(content);
            } catch (e1) {
              try {
                const decoded = Buffer.from(content, 'base64').toString('utf8');
                data = JSON.parse(decoded);
                fs.writeFileSync(filePath, decoded, 'utf8');
              } catch (e2) {
                console.error('::error title=Invalid JSON::GOOGLE_SERVICES_JSON secret is neither valid raw JSON nor valid base64-encoded JSON.');
                process.exit(1);
              }
            }
            if (!data.project_info || !data.client) {
              console.error('::error title=Malformed Firebase Config::google-services.json is missing required project_info or client definitions.');
              process.exit(1);
            }
            const packages = (data.client || []).map(c => c.client_info?.android_client_info?.package_name);
            if (!packages.includes('in.nrtec.collegeservices')) {
              console.error('::error title=Package Mismatch::google-services.json does not contain client configuration for package in.nrtec.collegeservices.');
              process.exit(1);
            }
            console.log('Firebase configuration successfully validated for package: in.nrtec.collegeservices');
          "

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEC-Services-debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup Firebase Secret Configuration
        if: always()
        run: rm -f frontend/android/app/google-services.json

