server.port=8080
server.address=0.0.0.0
spring.application.name=collegeservices-backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/collegeservices_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:nec_college_faculty_service_management_secure_jwt_token_secret_key_2026_xyz}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.nec.collegeservices=DEBUG
logging.level.org.springframework.security=INFO

# Web Push VAPID Configuration
app.vapid.public-key=BOhTIhLV2PbraKWzqTrUOz88Q33IuzrZ-nan8jWt4zsOzHkGuE4-AE0DRC94biUAEtTusgd77hOCMM09xrgOBIU
app.vapid.subject=mailto:admin@nec.edu.in
app.vapid.private-key=${VAPID_PRIVATE_KEY:}

# Email / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Email Notifications Configuration
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:no-reply@nrtec.in}}
app.mail.from-name=${APP_MAIL_FROM_NAME:NEC Service Management}
app.mail.app-url=${APP_URL:http://localhost:5173}
app.notification.cc-emails=${APP_NOTIFICATION_CC_EMAILS:zsonsoul@gmail.com}
app.notification.cc-events=${APP_NOTIFICATION_CC_EVENTS:REQUEST_SUBMITTED,REQUEST_APPROVED,REQUEST_REJECTED,REQUEST_CANCELLED}
