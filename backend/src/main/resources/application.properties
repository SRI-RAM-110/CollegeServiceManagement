server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=collegeservices-backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/collegeservices_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:nec_college_faculty_service_management_secure_jwt_token_secret_key_2026_xyz}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.nec.collegeservices=DEBUG
logging.level.org.springframework.security=INFO

# Web Push VAPID Configuration
app.vapid.public-key=BOhTIhLV2PbraKWzqTrUOz88Q33IuzrZ-nan8jWt4zsOzHkGuE4-AE0DRC94biUAEtTusgd77hOCMM09xrgOBIU
app.vapid.subject=mailto:admin@nec.edu.in
app.vapid.private-key=${VAPID_PRIVATE_KEY:}

# Optional Local Development Overrides (Ignored by Git; absent on Render)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Email Provider Selection: local (or smtp) for localhost, apps-script for Render production
app.mail.provider=${APP_MAIL_PROVIDER:${MAIL_PROVIDER:local}}

# Google Apps Script HTTPS Email Relay Configuration (Render Production)
app.mail.apps-script.url=${APP_SCRIPT_MAIL_URL:${APPS_SCRIPT_URL:}}
app.mail.apps-script.secret=${APP_SCRIPT_MAIL_SECRET:${APPS_SCRIPT_SECRET:}}

# Email / SMTP Configuration (Local Development)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${local.mail.username:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${local.mail.password:}}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# App Email Notifications Configuration
app.mail.enabled=${APP_MAIL_ENABLED:${MAIL_ENABLED:true}}
app.mail.from=${APP_MAIL_FROM:${MAIL_FROM:${spring.mail.username:no-reply@nrtec.in}}}
app.mail.from-name=${APP_MAIL_FROM_NAME:${MAIL_FROM_NAME:NEC Service Management}}
app.mail.app-url=${APP_URL:${FRONTEND_URL:http://localhost:5173}}

# Firebase Cloud Messaging (FCM) Configuration
app.firebase.credentials-path=${FIREBASE_CONFIG_PATH:${FIREBASE_CREDENTIALS_PATH:}}
app.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:${FIREBASE_CREDENTIALS:}}
